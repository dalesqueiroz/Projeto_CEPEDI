<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    {% if messages %}
        {% for msg in messages %}
        <div class="alert alert-{{msg.tags}}">
            {{msg}}
        </div>
        {% endfor %}
    {% endif %}
    <h1>atividades </h1>
    <form action="" method="post">{% csrf_token %}
        <p>matricula do estudante <input type="number" name="matricula" id="matricula"></p>
        <p>atividades complementares <input type="text" name="atividade" id="atividade"></p>
        <p>trabalho com a turma <input type="text" name="descricao" id="descricao"></p>
        <input type="submit" value="confirmar">
    </form>
</body>
</html>
