<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    {% if messages %}
        {% for msg in messages %}
        <div class="alert alert-{{msg.tags}}">
            {{msg}}
        </div>
        {% endfor %}
    {% endif %}
    <div class="container d-flex justify-content-center align-items-center vw-100">
        <div class="box p-4">
            <h1> Cadastrar equipe </h1>
            {% if quantidade == 0 %}
            <form action="{% url 'cadastro_equipe' %}" method="get">{% csrf_token %}

                <div class="mb-3">
                    <label for="quantidade" class="form-label">qual a quantidade de funcionarios</label>
                    <input class="form-control" type="number" name="quantidade" id="quantidade">
                </div>
                <input class="btn btn-success" type="submit" value="confirmar">
            </form>
            {% elif quantidade > 0 %}
            <form action="{% url 'cadastro_equipe' %}" method="post">{% csrf_token %}
                <div class="mb-3">
                    <label for="matricula" class="form-label">matricula</label>
                    <select class="form-select" name="matricula" id="matricula">
                        {% for estudante in estudantes %}
                        <option value="{{estudante.matricula}}">{{estudante.matricula}} - {{estudante.nome}}</option>
                        {% endfor %}
                    </select>
                </div>
                {% for i in lista %}
                <div class="mb-3"><label for="cpf_{{i}}" class="form-label">cpf funcionario</label>
                    <input class="form-control  " type="number" name="cpf_{{i}}" id="cpf_{{i}}">
                </div>
                {% endfor %}
                <input type="hidden" name="quantidade" value="{{quantidade}}">
                <input class="btn btn-success" type="submit" value="cadastrar">
            </form>
            {% endif %}
        </div>
    </div>
</body>
</html>
