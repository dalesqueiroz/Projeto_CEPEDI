<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    {% if messages %}
        {% for msg in messages %}
        <div class="alert alert-{{msg.tags}}">
            {{msg}}
        </div>
        {% endfor %}
    {% endif %}
    <div class="container d-flex justify-content-center align-items-center vw-100">
        <div class="box p-4">
            <h1> Cadastrar equipe </h1>
            <form action="{% url 'cadastro_equipe' %}" method="post">{% csrf_token %}
                <div class="mb-3">
                    <label for="matricula" class="form-label">matricula</label>
                    <select class="form-select" name="matricula" id="matricula">
                        {% for estudante in estudantes %}
                        <option value="{{estudante.matricula}}">{{estudante.matricula}} - {{estudante.nome}}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="cpf" class="form-label">cpf </label>
                    <select class="form-select" name="cpf" id="cpf" multiple>
                    {% for funcionario in funcionarios %}
                        <option value="{{funcionario.cpf}}">{{funcionario.cpf}} - {{funcionario.nome}}</option>
                    {% endfor %}
                     </select>
                </div>
                <input class="btn btn-success" type="submit" value="cadastrar">
            </form>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
