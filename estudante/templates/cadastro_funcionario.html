<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    {% if messages %}
        {% for msg in messages %}
        <div class="alert alert-{{msg.tags}}">
            {{msg}}
        </div>
        {% endfor %}
    {% endif %}
    <div class="d-flex container justify-content-center align-items-center flex-direction-row  vw-100">
        <div class="box p-4">
            <h1>cadastro funcionario</h1>
            <form action="{% url 'cadastro_funcionario' %}" method="post">{% csrf_token %}
                <div class="mb-3">
                    <label for="cpf" class="form-label">cpf</label>
                    <input class="form-control" type="number" name="cpf" id="cpf">
                </div>
                <div class="mb-3">
                    <label for="nome" class="form-label">nome</label>
                    <input class="form-control" type="text" name="nome" id="nome">
                </div>
                <div class="mb-3">
                    <label for="funcao" class="form-label">funcao</label>
                    <input class="form-control" type="text" name="funcao" id="funcao">
                </div>
                <input class="btn btn-success" type="submit" value="cadastrar">
            </form>
        </div>
    </div>
</body>
</html>
