<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    {% if messages %}
        {% for msg in messages %}
        <div class="alert alert-{{msg.tags}}">
            {{msg}}
        </div>
        {% endfor %}
    {% endif %}
    <div class="d-flex container justify-content-center align-items-center flex-direction-row vw-100">
        <div class="box p-4">
            <h1>Cadastro professor</h1>
            <form action="{% url 'cadastro_professor' %}" method="post">{% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">
                        cpf <input class="form-control" type="number" name="cpf" id="cpf">
                    </label>
                </div>
                <div class="mb-3">
                    <label class="form-label">
                        nome <input class="form-control" type="text" name="nome" id="nome">
                    </label>
                </div>
                <div class="mb-3">
                    <label class="form-label">
                        matricula <input class="form-control" type="number" name="matricula" id="matricula">
                    </label>
                </div>
                <div class="mb-3">
                    <label class="form-label">
                        data de nascimento <input class="form-control" type="date" name="data_de_nascimento" id="data_de_nascimento">
                    </label>
                </div>
                <div class="mb-3">
                    <label class="form-label">
                        email <input class="form-control" type="email" name="email" id="email">
                    </label>
                </div>
                <div class="mb-3">
                    <label class="form-label">
                        telefone <input class="form-control" type="text" name="telefone" id="telefone">
                    </label>
                </div>
                <input class="btn btn-success" type="submit" value="cadastrar">
            </form>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
