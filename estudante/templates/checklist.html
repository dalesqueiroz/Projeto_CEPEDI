<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    {% if messages %}
        {% for msg in messages %}
        <div class="alert alert-{{msg.tags}}">
            {{msg}}
        </div>
        {% endfor %}
    {% endif %}
    <div class="container d-flex justify-content-center align-items-center vw-100">
        <div class="box p-4">
            <h1>Checklist</h1>
            {% for item in lista %}
            <h1>{{item.tipo}}</h1>
            <form action="{% url 'checklist2' %}" method="post">{% csrf_token %}
                <div class="mb-3">
                    <label for="matricula{{ forloop.counter }}" class="form-label">matricula estudante</label>
                    <select class="form-select" name="matricula" id="matricula{{ forloop.counter }}">
                        {% for estudante in estudantes %}
                        <option value="{{estudante.matricula}}">{{estudante.matricula}} - {{estudante.nome}}</option>
                        {% endfor %}
                    </select>
                </div>
                <input type="hidden" name="tipo" value="{{item.tipo}}">
                    {% for adaptacao in item.checklist %}
                    <div class="mb-3">
                        <input class="form-check-input" type="checkbox" name="checklist" id="checklist{{ forloop.parentloop.counter }} - {{ forloop.counter }}" value="{{adaptacao}}">
                        <label for="checklist{{ forloop.parentloop.counter }} - {{ forloop.counter }}" class="form-check-label"> {{adaptacao}} </label>
                    </div>
                    {%endfor%}
                <div class="mb-3">
                    <label for="texto{{ forloop.counter }}" class="form-label">texto</label>
                    <input class="form-control" type="text" name="texto" id="texto{{ forloop.counter }}">
                </div>
                <input class="btn btn-success" type="submit" value="confirmar">
            </form>
            <hr>
            {% endfor %}
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
