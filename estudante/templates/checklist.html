<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Sistema de Gestão de PEI e Acompanhamento Pedagogico</title>
</head>
<body class="d-flex justify-content-center align-items-center min-vh-100">
    {% include 'barra_lateral.html' %}
    <main class="flex-grow-1 p-5">
        <div class="topbar fw-bold" style=" background-color: #00B612; color: #ffffff; font-size: 14px;">
            Sistema de Gestão de PEI e Acompanhamento Pedagogico
        </div>

        <br>
        {% if messages %}
            {% for msg in messages %}
            <div class="alert alert-{{msg.tags}}">
                {{msg}}
            </div>
            {% endfor %}
        {% endif %}
        <div class="box p-4">
            <div class="display-6 p-2">
                Adaptações
            </div>
            <hr class="w-100  m-0 p-0 border-dark">
            <br>
            {% for item in lista %}
            <p><button class="btn btn-secondary fs-5 w-100 py-3" commandfor="{{item.tipo}}" command="show-modal">{{item.tipo}}</button></p>
            <dialog id="{{item.tipo}}">
                <form action="{% url 'checklist2' %}" method="post">{% csrf_token %}
                    <div class="d-flex flex-column container-branco p-5 flex-shrink-0 p-3">
                        <div class="mb-3">
                            <label for="matricula" class="p-1">Matricula estudante</label>
                            <select class="form-select" name="matricula" id="matricula">
                                {% for estudante in estudantes %}
                                <option value="{{estudante.matricula}}">{{estudante.matricula}} - {{estudante.nome}}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <input type="hidden" name="tipo" value="{{item.tipo}}">
                        {% for adaptacao in item.checklist %}
                        <div class="mb-3">
                            <input class="form-check-input" type="checkbox" name="checklist"
                                   id="checklist{{ forloop.parentloop.counter }} - {{ forloop.counter}}"
                            value="{{adaptacao}}" required>
                            <label for="checklist{{ forloop.parentloop.counter }} - {{ forloop.counter }}"
                                   class="form-check-label"> {{adaptacao}} </label>
                        </div>
                        {%endfor%}
                        <div class="mb-3">
                            <label for="texto{{ forloop.counter }}" class="form-label">Descrever/Especificar as
                                adaptações selecionadas:</label>
                            <input class="form-control" type="text" name="texto" id="texto{{ forloop.counter }}" required>
                        </div>
                    </div>
                    <br>
                    <div class="row g-3">
                        <div class="col-6">
                            <input class="btn btn-success p-1 w-100" type="submit" value="Confirmar">
                        </div>
                        <div class="col-6">
                            <button type="button" class="btn btn-danger p-1 w-100" commandfor="{{item.tipo}}" command="close">Fechar</button>
                        </div>
                    </div>
                </form>
            </dialog>

                {% endfor %}
        </div>
    </main>
</body>
</html>
