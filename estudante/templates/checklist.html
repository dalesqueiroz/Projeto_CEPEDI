<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    {% if messages %}
        {% for msg in messages %}
        <div class="alert alert-{{msg.tags}}">
            {{msg}}
        </div>
        {% endfor %}
    {% endif %}
    <h1>Checklist</h1>
    {% for item in lista %}
    <h1>{{item.tipo}}</h1>
    <form action="{% url 'checklist2' %}" method="post">{% csrf_token %}
        <p> matricula estudante
            <select name="matricula" id="matricula">
                {% for estudante in estudantes %}
                <option value="{{estudante.matricula}}">{{estudante.matricula}} - {{estudante.nome}}</option>
                {% endfor %}
            </select>
        </p>
        <input type="hidden" name="tipo" value="{{item.tipo}}">
        {% for adaptacao in item.checklist %}
        <p>
            <label>
                <input type="checkbox" name="checklist" id="" value="{{adaptacao}}">
                {{adaptacao}}
            </label>
        </p>
        {%endfor%}
        <p>texto <input type="text" name="texto" id="texto"></p>
        <input class="btn btn-success" type="submit" value="confirmar">
    </form>
    <hr>
    {% endfor %}
</body>
</html>
