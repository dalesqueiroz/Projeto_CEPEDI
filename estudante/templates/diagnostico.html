<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    {% if messages %}
        {% for msg in messages %}
        <div class="alert alert-{{msg.tags}}">
            {{msg}}
        </div>
        {% endfor %}
    {% endif %}
    <div class="container d-flex justify-content-center align-items-center vw-100">
        <div class="box p-4">
            <h1>diagnostico</h1>
            <form action="{% url 'diagnostico' %}" method="post">{% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="estudante">matricula estudante</label>
                    <select class="form-select" name="estudante" id="estudante">
                        {% for estudante in estudantes %}
                        <option value="{{estudante.matricula}}">{{estudante.matricula}} - {{estudante.nome}}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="laudo" class="form-label">o estudante possui laudo </label>
                    <select class="form-select" name="laudo" id="laudo">
                        <option value="sim">sim</option>
                        <option value="nao">nao</option>
                        <option value="em fase de avaliacao">em fase de avaliacao</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="texto_diagnostico" class="form-label">qual o diagnostico</label>
                    <input class="form-control" type="text" name="texto_diagnostico" id="texto_diagnostico">
                </div>
                <div class="mb-3">
                    <label for="ano" class="form-label">ano que o diagnostico foi descoberto</label>
                    <input class="form-control" type="number" name="ano" id="ano">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="atendimento">realiza algum atendimento fora da escola</label>
                    <select class="form-select" name="atendimento" id="atendimento">
                        <option value="sim">sim</option>
                        <option value="nao">nao</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="texto_atendimento">texto</label>
                    <input class="form-control" type="text" name="texto_atendimento" id="texto_atendimento">
                </div>
                <input class="btn btn-success" type="submit" value="confirmar">
            </form>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
