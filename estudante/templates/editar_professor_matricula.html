<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
{% if messages %}
    {% for msg in messages %}
    <div class="alert alert-{{ msg.tags }}">
        {{msg}}
    </div>
    {% endfor %}
{% endif %}

<div class="container d-flex justify-content-center align-items-center vw-100">
    <div class="box p-4">
        <h1>editar professor matricula</h1>
        <form action="{% url 'editar_professor_matricula' %}" method="post">{% csrf_token %}
            <label for="matricula" class="form_label">matricula </label>
            <input type="number" name="matricula" id="matricula" class="form-control">
            <input class="btn btn-success" type="submit" value="confirmar">
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
