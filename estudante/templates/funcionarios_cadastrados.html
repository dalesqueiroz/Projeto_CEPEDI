<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body class="">
    {% if messages %}
        {% for msg in messages %}
        <div class="alert alert-{{msg.tags}}">
            {{msg}}
        </div>
        {% endfor %}
    {% endif %}
<div class="container d-flex justify-content-center align-items-center vw-100">
    <div class="box p-4">
        <h1>funcionarios cadastrados</h1>
        {% for funcionario in funcionarios %}
        <div class="card border-primary mb-3 text-dark" >
            <div class="card-header">funcionario</div>
            <div class="card-body text-dark">
                <h5 class="card-title">nome: {{funcionario.nome}}</h5>
                <p class="card-text">cpf: {{funcionario.cpf}}</p>
                <p class="card-text">funcao: {{funcionario.funcao}}</p>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
