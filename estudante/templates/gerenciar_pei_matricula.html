<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body class="bg-cinza d-flex justify-content-center align-items-center min-vh-100">
    {% include 'barra_lateral.html' %}
    <main class="flex-grow-1 p-5">
        <div class="topbar fw-bold" style=" background-color: #00B612; color: #ffffff; font-size: 14px;">
            Sistema de Gestão de PEI e Acompanhamento Pedagogico
        </div>
        {% if messages %}
            {% for msg in messages %}
            <div class="alert alert-{{ msg.tags }}">
                {{msg}}
            </div>
            {% endfor %}
        {% endif %}
        <div class="display-6 p-2">
            Gerenciar PEI
         </div>
        <br>
        <form action="{% url 'gerenciar_pei_matricula' %}" method="post">{% csrf_token %}
            <div class="d-flex flex-column container-branco p-5 flex-shrink-0 p-3">
                <label for="matricula" class="fs-5"> Informe a matricula do estudante: </label>
                <select class="form-select" name="matricula" id="matricula">
                    {% for estudante in estudantes %}
                    <option value="{{estudante.matricula}}">{{estudante.matricula}} - {{estudante.nome}}</option>
                    {% endfor %}
                </select>
            </div>

            <br>
            <p class="d-flex justify-content-end"><input class="btn btn-success p-1" type="submit" value="confirmar"></p>
        </form>
    </main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
