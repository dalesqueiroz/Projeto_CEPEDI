<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    {% if messages %}
        {% for msg in messages %}
        <div class="alert alert-{{msg.tags}}">
            {{msg}}
        </div>
        {% endfor %}
    {% endif %}
    <div class="container d-flex justify-content-center align-items-center vw-100">
        <div class="box p-4">
            <h1>habilidade academica</h1>
            <form action="{% url 'habilidade_academica' %}" method="post">{% csrf_token %}
                <div class="mb-3">
                    <select class="form-select" name="matricula" id="matricula">
                        {% for estudante in estudantes %}
                        <option value="{{estudante.matricula}}">{{estudante.matricula}} - {{estudante.nome}}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="componente" class="form-label">componente curricular</label>
                    <input class="form-control" type="text" name="componente" id="componente">
                </div>
                <div class="mb-3">
                    <input class="form-check-input" type="checkbox" name="adaptacao" id="item1" value="acesso ao curriculo">
                    <label for="item1" class="form-check-label">acesso ao curriculo</label>
                </div>


                <div class="mb-3">
                    <input class="form-check-input" type="checkbox" name="adaptacao" id="item2" value="conteudo">
                    <label for="item2" class="form-check-label">conteudo</label>
                </div>


                <div class="mb-3">
                    <input class="form-check-input" type="checkbox" name="adaptacao" id="item3" value="objetivos">
                    <label for="item3" class="form-check-label">objetivos</label>
                </div>


                <div class="mb-3">
                    <input class="form-check-input" type="checkbox" name="adaptacao" id="item4" value="metodologia e org didatica">
                    <label for="item4" class="form-check-label">metodologia e organizacao didatica</label>
                </div>

                <div class="mb-3">
                    <input class="form-check-input" type="checkbox" name="adaptacao" id="item5" value="temporalidade">
                    <label for="item5" class="form-check-label">temporalidade</label>
                </div>


                <div class="mb-3">
                    <input class="form-check-input" type="checkbox" name="adaptacao" id="item6" value="Avaliação">
                    <label for="item6" class="form-check-label">avaliacao<div class="mb-3"></div></label>
                </div>

                <div class="mb-3">
                    <label for="habilidade" class="form-label">habilidade</label>
                    <input class="form-control" type="text" name="habilidade" id="habilidade">
                </div>
                <div class="mb-3">
                    <label for="facilidade_dificuldade" class="form-label">facilidade e dificuldade</label>
                    <input class="form-control" type="text" name="facilidade_dificuldade" id="facilidade_dificuldade">
                </div>
                <div class="mb-3">
                    <label for="meta_turma" class="form-label">meta para turma</label>
                    <input class="form-control" type="text" name="meta_turma" id="meta_turma">
                </div>
                <div class="mb-3">
                    <label for="meta_especifica" class="form-label">meta especifica</label>
                    <input class="form-control" type="text" name="meta_especifica" id="meta_especifica">
                </div>
                <div class="mb-3">
                    <label for="procedimento" class="form-label">procedimento metodologicos</label>
                    <input class="form-control" type="text" name="procedimento" id="procedimento">
                </div>
                <div class="mb-3">
                    <label for="avaliacao" class="form-label">avaliacao</label>
                    <input class="form-control" type="text" name="avaliacao" id="avaliacao">
                </div>
                <input class="btn btn-success" type="submit" value="confirmar">

            </form>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
