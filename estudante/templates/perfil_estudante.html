<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    {% if messages %}
        {% for msg in messages %}
        <div class="alert alert-{{msg.tags}}">
            {{msg}}
        </div>
        {% endfor %}
    {% endif %}
    <h1>perfil do estudante</h1>
    <form action="{% url 'perfil_estudante' %}" method="post">{% csrf_token %}
        <p> matricula estudante
            <select name="matricula" id="matricula">
                {% for estudante in estudantes %}
                <option value="{{estudante.matricula}}">{{estudante.matricula}} - {{estudante.nome}}</option>
                {% endfor %}
            </select>
        </p>        <p>interesse <input type="text" name="interesse" id="interesse"></p>
        <p>habilidade <input type="text" name="habilidade" id="habilidade"></p>
        <p>nao gosta <input type="text" name="nao_gosta" id="nao_gosta"></p>
        <p>desafio <input type="text" name="desafio" id="desafio"></p>
        <p>outras informações <input type="text" name="informacao" id="informacao"></p>
        <input type="submit" value="confirmar">
    </form>
</body>
</html>
