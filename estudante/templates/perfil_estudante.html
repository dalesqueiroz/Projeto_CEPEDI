<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    {% if messages %}
        {% for msg in messages %}
        <div class="alert alert-{{msg.tags}}">
            {{msg}}
        </div>
        {% endfor %}
    {% endif %}


    <div class="container d-flex justify-content-center align-items-center vw-100">
        <div class="box p-4">
            <h1>perfil do estudante</h1>
            <form action="{% url 'perfil_estudante' %}" method="post">{% csrf_token %}
                <div class="mb-3">
                    <label for="matricula" class="form-label">matricula estudante</label>
                    <select class="form-select" name="matricula" id="matricula">
                        {% for estudante in estudantes %}
                        <option value="{{estudante.matricula}}">{{estudante.matricula}} - {{estudante.nome}}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="interesse" class="form-label">interesse</label>
                    <input class="form-control" type="text" name="interesse" id="interesse">
                </div>
                <div class="mb-3">
                    <label for="habilidade" class="form-label">habilidade</label>
                    <input class="form-control" type="text" name="habilidade" id="habilidade">
                </div>
                <div class="mb-3">
                    <label for="nao_gosta" class="form-label">nao gosta</label>
                    <input class="form-control" type="text" name="nao_gosta" id="nao_gosta">
                </div>
                <div class="mb-3">
                    <label for="desafio" class="form-label">desafio</label>
                    <input class="form-control" type="text" name="desafio" id="desafio">
                </div>
                <div class="mb-3">
                    <label for="informacao" class="form-label">outras informacoes</label>
                    <input class="form-control" type="text" name="informacao" id="informacao">
                </div>
                <input class="btn btn-success" type="submit" value="confirmar">
            </form>
        </div>
    </div>
</body>
</html>
