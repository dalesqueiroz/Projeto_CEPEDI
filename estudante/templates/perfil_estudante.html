<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body class="bg-cinza d-flex justify-content-center align-items-center min-vh-100">
    {% include 'barra_lateral.html' %}
    <main class="flex-grow-1 p-5">
        <div class="topbar fw-bold" style=" background-color: #00B612; color: #ffffff; font-size: 14px;">
            Sistema de Gestão de PEI e Acompanhamento Pedagogico
        </div>

        <br>
        {% if messages %}
            {% for msg in messages %}
            <div class="alert alert-{{msg.tags}}">
                {{msg}}
            </div>
            {% endfor %}
        {% endif %}

        <div class="display-6 p-2">
            Cadastro de perfil do estudante
        </div>
        <form action="{% url 'perfil_estudante' %}" method="post">{% csrf_token %}
            <div class="d-flex flex-column container-branco p-5 flex-shrink-0 p-3">
                    <div class="mb-3">
                        <label for="matricula" class="form-label">Informe o estudante</label>
                        <select class="form-select" name="matricula" id="matricula">
                            {% for estudante in estudantes %}
                                <option value="{{estudante.matricula}}">{{estudante.matricula}} - {{estudante.nome}}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="interesse" class="form-label">Principais interesse</label>
                        <input class="form-control" type="text" name="interesse" id="interesse">
                    </div>
                    <div class="mb-3">
                        <label for="habilidade" class="form-label">Principais habilidade</label>
                        <input class="form-control" type="text" name="habilidade" id="habilidade">
                    </div>
                    <div class="mb-3">
                        <label for="nao_gosta" class="form-label">Não gosta</label>
                        <input class="form-control" type="text" name="nao_gosta" id="nao_gosta">
                    </div>
                    <div class="mb-3">
                        <label for="desafio" class="form-label">Principais Dificuldades e Desafios</label>
                        <input class="form-control" type="text" name="desafio" id="desafio">
                    </div>
                    <div class="mb-3">
                        <label for="informacao" class="form-label">Outras informações relevantes (indicar de forma sucinta elementos de apoio oferecidos pela família, profissionais clínicos e outros atendimentos/tratamentos/encaminhamentos)</label>
                        <input class="form-control" type="text" name="informacao" id="informacao">
                    </div>
                    <input class="btn btn-success p-1 w-100" type="submit" value="confirmar">
            </div>
        </form>
    </main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
