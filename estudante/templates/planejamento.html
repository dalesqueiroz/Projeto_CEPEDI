<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    {% if messages %}
        {% for msg in messages %}
        <div class="alert alert-{{msg.tags}}">
            {{msg}}
        </div>
        {% endfor %}
    {% endif %}
    <div class="container d-flex justify-content-center align-items-center vw-100">
        <div class="box p-4">
            <h1>Planejamento</h1>
            <form action="" method="post">{% csrf_token %}
                <div class="mb-3">
                    <label for="matricula" class="form-label">matricula estudante</label>
                    <select class="form-select" name="matricula" id="matricula">
                        {% for estudante in estudantes %}
                        <option value="{{estudante.matricula}}">{{estudante.matricula}} - {{estudante.nome}}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="habilidade" class="form-label">habilidade</label>
                    <input class="form-control" type="text" name="habilidade" id="habilidade">
                </div>
                <div class="mb-3">
                    <label for="meta_curto_prazo" class="form-label">meta curto prazo</label>
                    <input class="form-control" type="text" name="meta_curto_prazo" id="meta_curto_prazo">
                </div>
                <div class="mb-3">
                    <label for="meta_medio_prazo" class="form-label">meta medio prazo</label>
                    <input class="form-control" type="text" name="meta_medio_prazo" id="meta_medio_prazo">
                </div>
                <div class="mb-3">
                    <label for="meta_longo_prazo" class="form-label">meta longo prazo</label>
                    <input class="form-control" type="text" name="meta_longo_prazo" id="meta_longo_prazo">
                </div>
                <input class="btn btn-success" type="submit" value="confirmar">
            </form>
        </div>
    </div>
</body>
</html>
