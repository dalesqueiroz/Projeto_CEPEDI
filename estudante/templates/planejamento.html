<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    {% if messages %}
        {% for msg in messages %}
        <div class="alert alert-{{msg.tags}}">
            {{msg}}
        </div>
        {% endfor %}
    {% endif %}
    <h1>Planejamento</h1>
    <form action="" method="post">{% csrf_token %}
        <p>matricula do estudante <input type="number" name="matricula" id="matricula"></p>
        <p>habilidades <input type="text" name="habilidade" id="habilidade"></p>
        <p>metas curto prazo <input type="text" name="meta_curto_prazo" id="meta_curto_prazo"></p>
        <p>metas medio prazo <input type="text" name="meta_medio_prazo" id="meta_medio_prazo"></p>
        <p>meta longo prazo <input type="text" name="meta_longo_prazo" id="meta_longo_prazo"></p>
        <input type="submit" value="confirmar">
    </form>
</body>
</html>
