<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Cadastro sistema</title>
</head>
<style>
    .bg-cinza{
        background-color: #DEDEDE;
        font-family: 'Roboto', sans-serif;
    }
    .container-branco{
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        background-color: #ffffff;
    }
</style>
<body class="bg-cinza d-flex justify-content-center align-items-center min-vh-100">
    {% if messages %}
        {% for msg in messages %}
        <div class="alert alert-{{msg.tags}}">
            {{msg}}
        </div>
        {% endfor %}
    {% endif %}
    <div class="d-flex flex-column container-branco p-5 flex-shrink-0 p-3 ">
        <div class="box p-4">
            <div class="display-6 p-2">Realizar cadastro</div>
            <form action="{% url 'cadastro_sistema' %}" method="post">{% csrf_token %}
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome</label>
                    <input class="form-control" type="text" name="nome" id="nome">
                </div>
                <div class="mb-3">
                    <label for="cpf" class="form-label">CPF</label>
                    <input class="form-control" type="text" name="cpf" id="cpf">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input class="form-control" type="text" name="email" id="email">
                </div>
                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <input class="form-control" type="password" name="senha" id="senha">
                </div>
               <input class="btn btn-success p-1 w-100" type="submit" value="Cadastrar">
            </form>
            <br>
                <a href="{% url 'sair' %}" class="nav-link link-black text-end p-1 " style="font-size: 11px;">
                        Voltar para login
                </a>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
